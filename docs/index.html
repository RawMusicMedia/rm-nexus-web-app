<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RM Nexus</title>
<meta name="description" content="Room bookings, visitors and equipment at Raw Material.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RM Nexus">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F3F2F2">
<style>
html,body{margin:0;height:100%;background:#F3F2F2;overscroll-behavior:none}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}
#off{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;background:#F3F2F2;color:#0A0A0A;font:16px/1.5 'Helvetica Neue',Helvetica,Arial,sans-serif;text-align:center}
#off[hidden]{display:none}
#off img{width:72px;height:72px}
#off strong{font-size:20px}
#off p{margin:0;max-width:360px;color:#5C5A59}
</style>
<script src="./config.js"></script>
</head>
<body>
<iframe id="app" title="RM Nexus" allow="clipboard-write; fullscreen"></iframe>
<div id="off" hidden><img src="./icons/icon-192.png" alt=""><strong>You're offline</strong><p>RM Nexus will reload as soon as you're back online.</p></div>
<script src="./shell.js" data-page="" data-root="./"></script>
</body>
</html>
