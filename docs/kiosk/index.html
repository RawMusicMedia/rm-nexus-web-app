<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Sign in · Raw Material</title>
<meta name="description" content="Visitor sign-in.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sign in">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F3F2F2">
<style>
html,body{margin:0;height:100%;background:#F3F2F2;overscroll-behavior:none}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}
#load{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#F3F2F2;transition:opacity .3s;z-index:1}
#load.done{opacity:0;pointer-events:none}
#load img{width:72px;height:72px;border-radius:16px}
#load i{display:block;width:120px;height:4px;border-radius:2px;background:#E4E1E0;overflow:hidden;position:relative}
#load i::after{content:"";position:absolute;inset:0;width:40%;background:#0A0A0A;border-radius:2px;animation:ld 1.1s ease-in-out infinite}
@keyframes ld{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
@media (prefers-reduced-motion:reduce){#load i::after{animation:none;width:100%;opacity:.35}}
#off{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;background:#F3F2F2;color:#0A0A0A;font:16px/1.5 'Helvetica Neue',Helvetica,Arial,sans-serif;text-align:center}
#off[hidden]{display:none}
#off img{width:72px;height:72px}
#off strong{font-size:20px}
#off p{margin:0;max-width:360px;color:#5C5A59}
</style>
<script src="../config.js"></script>
</head>
<body>
<iframe id="app" title="Sign in · Raw Material" allow="clipboard-write; fullscreen"></iframe>
<div id="load" role="status" aria-label="Loading"><img src="../icons/icon-192.png" alt=""><i></i></div>
<div id="off" hidden><img src="../icons/icon-192.png" alt=""><strong>You're offline</strong><p>Sign-in will be back as soon as the internet reconnects. Please let a member of staff know you're here.</p></div>
<script src="../shell.js" data-page="kiosk" data-root="../"></script>
</body>
</html>
